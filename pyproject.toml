[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-run"
version = "1.4.0"
description = "Backend-neutral ML run lifecycle, checkpoints, and visual experiment timelines for Silver."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Silver Contributors"}]
keywords = ["machine-learning", "training", "checkpoint", "experiments", "visualization", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/adfgdartec/silver-run"
Repository = "https://github.com/adfgdartec/silver-run"
Issues = "https://github.com/adfgdartec/silver-run/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
silver_run = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
