name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Verify tag matches package version
        run: python -c "import os,tomllib,pathlib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; t=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert t == v, f'tag {t} does not match package {v}'"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: silver-run-${{ github.ref_name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
